name: confidentialite

# Garde-fou : le dépôt est public — aucune donnée personnelle (fichiers, texte des PDF, PNG, binaires).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  confidentialite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install pytest
      - name: Garde-fou
        run: python -m pytest -q tests/test_confidentialite.py
